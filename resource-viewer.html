const DOCS = [
  { id: 'kids', title: 'PRC Pakistan Kids Story E-book', pages: 20, ratio: 141.4286, src: 'https://www.canva.com/design/DAHRytCq2so/GDYp6au-xBuuHBgumCREvw/view?embed', url: 'https://www.canva.com/design/DAHRytCq2so/GDYp6au-xBuuHBgumCREvw/view' },
  { id: 'palestine', title: 'Palestine \u2014 The Land of Prophets', pages: 12, ratio: 156.25, src: 'https://www.canva.com/design/DAG0_oletxQ/3NM-bqRAXtFeWUEv5gNXKA/view?embed', url: 'https://www.canva.com/design/DAG0_oletxQ/3NM-bqRAXtFeWUEv5gNXKA/view' }
];

const query = new URLSearchParams(window.location.search);
let current = DOCS.find((d) => d.id === query.get('doc')) || DOCS[0];

const wrap = document.getElementById('frame-wrap');
const titleEl = document.getElementById('doc-title');
const frame = document.getElementById('doc-frame');
const openLink = document.getElementById('open-canva');

let zoom = 1;

function sizeFrame() {
  const k = 100 / current.ratio;
  wrap.style.aspectRatio = k + ' / 1';
  const w = 'calc((100vh - 15rem) * ' + (k * zoom) + ')';
  wrap.style.width = zoom === 1 ? 'min(100%, ' + w + ')' : w;
}

function selectDoc(doc) {
  current = doc;
  titleEl.textContent = doc.title;
  document.title = doc.title + ' - PRC Pakistan';
  frame.src = doc.src;
  frame.title = doc.title;
  openLink.href = doc.url;
  document.querySelectorAll('.doc-btn').forEach(function (b) {
    b.classList.toggle('bg-primary', b.dataset.id === doc.id);
    b.classList.toggle('text-white', b.dataset.id === doc.id);
    b.classList.toggle('border-primary', b.dataset.id === doc.id);
    b.classList.toggle('text-dark/70', b.dataset.id !== doc.id);
  });
  refreshStates();
  sizeFrame();
}

DOCS.forEach(function (d) {
  const btn = document.getElementById('btn-' + d.id);
  if (btn) {
    btn.addEventListener('click', function () {
      selectDoc(d);
      if (window.history && history.replaceState) {
        history.replaceState(null, '', '?doc=' + d.id);
      }
    });
  }
});

const MAX_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>';
const EXIT_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3"></path><path d="M21 8h-3a2 2 0 0 1-2-2V3"></path><path d="M3 16h3a2 2 0 0 1 2 2v3"></path><path d="M16 21v-3a2 2 0 0 1 2-2h3"></path></svg>';
const fsBtn = document.getElementById('fullscreen-btn');
if (fsBtn) {
  fsBtn.addEventListener('click', function () {
    if (!document.fullscreenElement) {
      if (wrap.requestFullscreen) wrap.requestFullscreen();
      else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', function () {
    fsBtn.innerHTML = document.fullscreenElement ? EXIT_SVG : MAX_SVG;
  });
}

const LIKE_KEY = 'prc_resource_likes';
const DISLIKE_KEY = 'prc_resource_dislikes';
const REPORT_KEY = 'prc_resource_reports';
function storeList(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; } }
function storeSet(key, list) { try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) {} }
function hasState(key, id) { return storeList(key).indexOf(id) !== -1; }
function toggleState(key, id) {
  const list = storeList(key);
  const i = list.indexOf(id);
  if (i > -1) list.splice(i, 1); else list.push(id);
  storeSet(key, list);
}

const likeBtn = document.getElementById('like-btn');
const dislikeBtn = document.getElementById('dislike-btn');
const reportBtn = document.getElementById('report-btn');
const shareBtn = document.getElementById('share-btn');
const zoomLabel = document.getElementById('zoom-label');

function refreshStates() {
  const liked = hasState(LIKE_KEY, current.id);
  const disliked = hasState(DISLIKE_KEY, current.id);
  const reported = hasState(REPORT_KEY, current.id);
  likeBtn.classList.toggle('liked', liked);
  likeBtn.classList.toggle('active', liked);
  likeBtn.setAttribute('aria-pressed', String(liked));
  dislikeBtn.classList.toggle('active', disliked);
  dislikeBtn.setAttribute('aria-pressed', String(disliked));
  reportBtn.classList.toggle('active', reported);
  reportBtn.setAttribute('aria-pressed', String(reported));
}

likeBtn.addEventListener('click', function () { toggleState(LIKE_KEY, current.id); refreshStates(); });

// Dislike / Report — ask for a reason, then send via the contact form's Web3Forms API
const reportModal = document.getElementById('report-modal');
const fbTitle = document.getElementById('fb-title');
const fbMeta = document.getElementById('fb-meta');
const fbReason = document.getElementById('fb-reason');
const fbPage = document.getElementById('fb-page');
const fbSend = document.getElementById('fb-send');
let fbKind = 'report';

function openFeedback(kind) {
  fbKind = kind;
  fbTitle.textContent = kind === 'dislike' ? 'Dislike this resource' : 'Report this resource';
  fbMeta.textContent = current.title + ' \u2014 ' + (kind === 'dislike' ? 'What bothered you?' : 'Let us know what needs attention.');
  fbReason.value = '';
  fbPage.value = '';
  reportModal.classList.remove('hidden');
}
function closeFeedback() { reportModal.classList.add('hidden'); }

dislikeBtn.addEventListener('click', function () { openFeedback('dislike'); });
reportBtn.addEventListener('click', function () { openFeedback('report'); });
document.getElementById('fb-close').addEventListener('click', closeFeedback);
document.getElementById('fb-cancel').addEventListener('click', closeFeedback);
reportModal.addEventListener('click', function (e) { if (e.target === reportModal) closeFeedback(); });

fbSend.addEventListener('click', async function () {
  const reason = fbReason.value.trim();
  if (!reason) { fbReason.focus(); return; }
  const specific = fbPage.value.trim();
  const btn = this;
  btn.disabled = true;
  const og = btn.textContent;
  btn.textContent = 'Sending...';
  const fd = new FormData();
  fd.append('access_key', '5f43d33b-3cf6-4fa4-9d46-ea85eddec8dc');
  fd.append('subject', 'Resource ' + fbKind + ' \u2014 ' + current.title);
  fd.append('from_name', 'PRC Resource Viewer');
  fd.append('email', 'tech.prc.pk@gmail.com');
  fd.append('message',
    'Resource: ' + current.title + '\n' +
    'Type: ' + fbKind + '\n' +
'Reason: ' + reason + '\n' +
    (specific ? 'Specific page: ' + specific + '\n' : '') +
    'Viewer URL: ' + window.location.href);
  try {
    const res = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: fd });
    if (res.ok) {
      closeFeedback();
      const target = fbKind === 'dislike' ? dislikeBtn : reportBtn;
      target.classList.add('active');
      target.setAttribute('aria-pressed', 'true');
    } else {
      alert('Could not send your feedback. Please try again.');
    }
  } catch (e) {
    alert('Could not send your feedback. Please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = og;
  }
});

const ZOOM_MIN = 0.25, ZOOM_MAX = 4, ZOOM_STEP = 0.25;
const zoomResetBtn = document.getElementById('zoom-reset');
zoomResetBtn.classList.add('hidden');
function applyZoom() {
  zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom));
  sizeFrame();
  zoomLabel.textContent = Math.round(zoom * 100) + '%';
  zoomResetBtn.classList.toggle('hidden', zoom === 1);
}
document.getElementById('zoom-in').addEventListener('click', function () { zoom += ZOOM_STEP; applyZoom(); });
document.getElementById('zoom-out').addEventListener('click', function () { zoom -= ZOOM_STEP; applyZoom(); });
document.getElementById('zoom-reset').addEventListener('click', function () { zoom = 1; applyZoom(); });

const SHARE_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>';
const CHECK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>';
shareBtn.addEventListener('click', function () {
  const u = new URL(window.location.href);
  u.search = '';
  u.searchParams.set('doc', current.id);
  const copied = function () {
    shareBtn.innerHTML = CHECK_SVG;
    setTimeout(function () { shareBtn.innerHTML = SHARE_SVG; }, 1600);
    showShareToast(u.href);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      navigator.clipboard.writeText(u.href).then(copied, copied);
    } catch (e) {
      copied(); // clipboard threw synchronously — still show the share card
    }
  } else {
    copied();
  }
});

let shareTimer = null;
function showShareToast(url) {
  const enc = encodeURIComponent;
  const title = current.title;
  document.getElementById('toast-wa').href = 'https://wa.me/?text=' + enc(title + ' \u2014 ' + url);
  document.getElementById('toast-fb').href = 'https://www.facebook.com/sharer/sharer.php?u=' + enc(url);
  document.getElementById('toast-x').href = 'https://twitter.com/intent/tweet?url=' + enc(url) + '&text=' + enc(title);
  document.getElementById('toast-mail').href = 'mailto:?subject=' + enc(title) + '&body=' + enc('Check out this resource: ' + url);
  const t = document.getElementById('share-toast');
  t.classList.remove('hidden', 'toast-out');
  void t.offsetWidth;
  t.classList.add('toast-in');
  clearTimeout(shareTimer);
  shareTimer = setTimeout(hideShareToast, 12000);
}
function hideShareToast() {
  const t = document.getElementById('share-toast');
  if (t.classList.contains('hidden')) return;
  t.classList.remove('toast-in');
  t.classList.add('toast-out');
  setTimeout(function () { t.classList.add('hidden'); t.classList.remove('toast-out'); }, 280);
}
document.getElementById('toast-close').addEventListener('click', hideShareToast);

window.addEventListener('resize', sizeFrame);
selectDoc(current);
</script>

<script>
const logoBtn = document.getElementById('logo-btn');
const navPanel = document.getElementById('nav-panel');

function toggleNav(open) {
  const show = typeof open === 'boolean' ? open : navPanel.classList.contains('hidden');
  navPanel.classList.toggle('hidden', !show);
  logoBtn.setAttribute('aria-expanded', String(show));
}

if (logoBtn && navPanel) {
  logoBtn.addEventListener('click', function (e) {
    e.preventDefault();
    toggleNav();
  });
  navPanel.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () { toggleNav(false); });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#logo-btn') && !e.target.closest('#nav-panel')) {
      toggleNav(false);
    }
  });
}
</script>
